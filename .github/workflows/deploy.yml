name: Build, Push and Deploy to Azure

# 触发条件：push 到 main 分支时自动运行
on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    name: 构建镜像并推送到 ACR
    runs-on: ubuntu-latest

    steps:
      # 第一步：拉取代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 第二步：登录 Azure Container Registry
      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # 第三步：构建并推送 student-service 镜像
      - name: Build and push student-service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./student-service/Dockerfile
          push: true
          tags: ${{ secrets.REGISTRY_LOGIN_SERVER }}/student-service:latest

      # 第四步：构建并推送 score-service 镜像
      - name: Build and push score-service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./score-service/Dockerfile
          push: true
          tags: ${{ secrets.REGISTRY_LOGIN_SERVER }}/score-service:latest

      # 第五步：构建并推送 gateway-service 镜像
      - name: Build and push gateway-service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./gateway-service/Dockerfile
          push: true
          tags: ${{ secrets.REGISTRY_LOGIN_SERVER }}/gateway-service:latest

  deploy:
    name: 部署到 Azure Container Apps
    runs-on: ubuntu-latest
    needs: build-and-push   # 必须等镜像推送完成后才执行

    steps:
      # 第一步：登录 Azure
      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 第二步：部署 student-service
      - name: Deploy student-service
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az containerapp update \
              --name student-service \
              --resource-group spring-cloud-rg \
              --image ${{ secrets.REGISTRY_LOGIN_SERVER }}/student-service:latest \
              --set-env-vars \
                "DB_HOST=${{ secrets.DB_HOST }}" \
                "DB_USERNAME=${{ secrets.DB_USERNAME }}" \
                "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" \
                "NACOS_HOST=nacos-app" \
                "NACOS_PORT=8848"

      # 第三步：部署 score-service
      - name: Deploy score-service
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az containerapp update \
              --name score-service \
              --resource-group spring-cloud-rg \
              --image ${{ secrets.REGISTRY_LOGIN_SERVER }}/score-service:latest \
              --set-env-vars \
                "DB_HOST=${{ secrets.DB_HOST }}" \
                "DB_USERNAME=${{ secrets.DB_USERNAME }}" \
                "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" \
                "NACOS_HOST=nacos-app" \
                "NACOS_PORT=8848"

      # 第四步：部署 gateway-service
      - name: Deploy gateway-service
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az containerapp update \
              --name gateway-service \
              --resource-group spring-cloud-rg \
              --image ${{ secrets.REGISTRY_LOGIN_SERVER }}/gateway-service:latest \
              --set-env-vars \
                "NACOS_HOST=nacos-app" \
                "NACOS_PORT=8848"
