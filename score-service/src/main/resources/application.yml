server:
  port: 8082

spring:
  application:
    name: score-service

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/java_learn?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:localhost}:${NACOS_PORT:8848}
        fail-fast: false    # 连接失败时不崩溃，后台重试

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.onycom.score.entity
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.onycom.score.mapper: debug

resilience4j:
  circuitbreaker:
    instances:
      studentService:                    # 熔断器的名字，后面代码里会用到
        sliding-window-size: 10          # 统计最近10次调用
        failure-rate-threshold: 50       # 失败率超过50%就熔断
        wait-duration-in-open-state: 10s # 熔断后等10秒再尝试恢复
        permitted-number-of-calls-in-half-open-state: 3  # 半开状态允许3次试探

  timelimiter:
    instances:
      studentService:
        timeout-duration: 3s             # 超过3秒没响应就超时

feign:
  circuitbreaker:
    enabled: true